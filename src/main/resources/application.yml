spring:
  application:
    name: CinemaBooking
  config:
    import: optional:file:.env[.properties]

  ai:
    tools:
      throw-exception-on-error: ${AI_TOOL_THROW_ON_ERROR:true}
    chat:
      client:
        tool-calling:
          enabled: ${AI_TOOL_CALLING_ENABLED:true}
    model:
      chat: ${AI_CHAT_PROVIDER:openai}
      embedding: openai
    openai:
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: ${AI_VECTOR_INITIALIZE_SCHEMA:true}
        table-name: movie_vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000

    consumer:
      group-id: cinema-notification
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed

    listener:
      ack-mode: record

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    congtuong.dev.cinemabooking.ai.retrieval.HybridMovieRetrieverImpl: ${AI_HYBRID_SEARCH_LOG_LEVEL:DEBUG}
    congtuong.dev.cinemabooking.ai.ranking.MovieRerankerImpl: ${AI_HYBRID_SEARCH_LOG_LEVEL:DEBUG}
    congtuong.dev.cinemabooking.ai.tool: ${AI_TOOL_LOG_LEVEL:DEBUG}

app:
  ai:
    rag:
      top-k: ${AI_RAG_TOP_K:3}
      candidate-k: ${AI_RAG_CANDIDATE_K:10}
      rrf-constant: ${AI_RAG_RRF_CONSTANT:60}
      rerank-enabled: ${AI_RAG_RERANK_ENABLED:true}
      similarity-threshold: ${AI_RAG_SIMILARITY_THRESHOLD:0.00}
  kafka:
    topics:
      user-events: cinema.user.events
      booking-events: cinema.booking.events
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 30m
    refresh-token-expiration: 14d

booking:
  seat-hold-duration-minutes: ${SEAT_HOLD_DURATION_MINUTES:10}
  expiration-enabled: ${BOOKING_EXPIRATION_ENABLED:true}
  expiration-poll-interval-ms: ${BOOKING_EXPIRATION_POLL_INTERVAL_MS:2000}

media:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
    ipn-url: ${VNPAY_IPN_URL:}
    version: 2.1.0
    command: pay
    order-type: other
    locale: vn
  momo:
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    redirect-url: ${MOMO_REDIRECT_URL:}
    ipn-url: ${MOMO_IPN_URL:}
    request-type: captureWallet
    lang: vi
    partner-name: CinemaBooking
    store-id: CinemaBooking
    timeout-seconds: 30
